name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            shared: 'OFF'
          - build_type: Release
            shared: 'ON'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev openssl
      - name: Set up Dyne static toolchain
        if: matrix.shared == 'OFF'
        uses: dyne/musl-action@d26fe56f7fe134a54e729d781ec687e847db34d3
        with:
          target_arch: x86_64
      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          SHARED: ${{ matrix.shared }}
        run: |
          args=()
          if [[ "$SHARED" == OFF ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/dyne-musl.cmake")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBUILD_SHARED_LIBS="$SHARED" "${args[@]}"
      - name: Build unified library and tests
        run: cmake --build build --parallel 2
      - name: Run inherited suites
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Install
        run: cmake --install build --prefix "$PWD/install"
      - name: Check installed names and paths
        env:
          SHARED: ${{ matrix.shared }}
        run: |
          static=ON
          if [[ "$SHARED" == ON ]]; then static=OFF; fi
          cmake -Dprefix="$PWD/install" -Dstatic="$static" -P tests/check-install.cmake
      - name: Build and run installed consumer
        env:
          SHARED: ${{ matrix.shared }}
        run: |
          args=()
          if [[ "$SHARED" == OFF ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/dyne-musl.cmake")
          fi
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install" "${args[@]}"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build_type }}
          path: build/**/Testing/Temporary/*.log
          if-no-files-found: ignore

  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build binutils
      - uses: dyne/musl-action@d26fe56f7fe134a54e729d781ec687e847db34d3
        id: musl
        with:
          target_arch: x86_64
      - name: Build and verify the production release package
        env:
          CC: ${{ steps.musl.outputs.CC }}
          CXX: ${{ steps.musl.outputs.CXX }}
        run: bash scripts/build-musl-release.sh "$PWD" 1.4.0 "$PWD/build/release"
