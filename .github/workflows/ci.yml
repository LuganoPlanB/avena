name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            shared: 'OFF'
          - build_type: Release
            shared: 'ON'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev openssl
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build all libraries and tests
        run: cmake --build build --parallel 2
      - name: Run inherited suites
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Install
        run: cmake --install build --prefix "$PWD/install"
      - name: Build and run installed consumer
        run: |
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.build_type }}
          path: build/**/Testing/Temporary/*.log
          if-no-files-found: ignore

  production-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Build without test support
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DOATPP_LINK_TEST_LIBRARY=OFF
          cmake --build build --parallel 2
          cmake --install build --prefix "$PWD/install"
      - name: Verify installed production libraries
        run: |
          cmake -S tests/consumer -B build/consumer -G Ninja -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure --no-tests=error
